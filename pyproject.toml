[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geneweaver"
version = "0.1.0"
description = "GPU-Accelerated CRISPR Off-Target Alignment and Scoring Engine"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "GeneWeaver Contributors" }
]
keywords = [
    "bioinformatics",
    "crispr",
    "cuda",
    "gpu",
    "alignment",
    "dask",
    "genomics",
    "off-target",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "biopython>=1.83",
    "numba>=0.59.0",
    "cupy-cuda12x>=13.0.0; platform_system != 'Darwin'",
    "dask[distributed]>=2024.1.0",
    "textual>=0.50.0",
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
    "pynvml>=11.5.0",
    "psutil>=5.9.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.scripts]
geneweaver = "geneweaver.dashboard.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "cuda: mark test as requiring NVIDIA CUDA GPU hardware and drivers",
    "slow: mark test as a long-running integration or benchmark test",
    "parity: mark test as validating CPU vs GPU output parity",
]
